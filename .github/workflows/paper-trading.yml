name: V9.2 Paper Trading Cycle
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: paper-trading-state
  cancel-in-progress: false
jobs:
  paper:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run paper cycle
        run: python paper_engine.py || echo "ENGINE_FAILED=1" >> "$GITHUB_ENV"
      - name: Save ledger
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paper_state.json
          if ! git diff --cached --quiet; then
            git commit -m "paper: save simulation cycle [skip ci]"
            git push
      - name: Fail workflow on market data error
        if: env.ENGINE_FAILED == '1'
        run: exit 1
          fi
